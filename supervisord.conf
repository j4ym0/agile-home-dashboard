[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root                        ; explicit — silences the CRIT warning

[program:apache]
command=/usr/local/bin/apache2-foreground
user=root                        ; apache2-foreground drops to www-data for workers
autostart=true
autorestart=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:python]
command=python /service/main.py
directory=/service
user=www-data                    ; Same user as apache2
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0